<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280"><rect width="1120" height="280" rx="18" fill="#f3f6fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#436382"/></marker></defs><text x="30" y="42" font-family="Arial" font-size="25" font-weight="bold" fill="#14283f">Conditional flow matching</text><rect x="30" y="80" width="320" height="115" rx="14" fill="#dceafa"/><text x="48" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#14283f">Sample a training path</text><text x="48" y="157" font-family="Arial" font-size="16" fill="#304b68">h_tau = (1−tau) z + tau x_0</text><path d="M358 137 H387" stroke="#436382" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="80" width="320" height="115" rx="14" fill="#e0f0e8"/><text x="414" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#14283f">Learn its tangent</text><text x="414" y="157" font-family="Arial" font-size="16" fill="#304b68">u_target = x_0 − z</text><path d="M724 137 H753" stroke="#436382" stroke-width="3" marker-end="url(#a)"/><rect x="762" y="80" width="320" height="115" rx="14" fill="#eee4fa"/><text x="780" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#14283f">Integrate the learned field</text><text x="780" y="157" font-family="Arial" font-size="16" fill="#304b68">h ← h + delta_tau · u_theta</text><text x="30" y="244" font-family="Arial" font-size="17" fill="#304b68">The field depends on the current whole-clip state, the image, and generation time tau.</text></svg>