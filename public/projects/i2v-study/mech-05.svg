<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280"><rect width="1120" height="280" rx="18" fill="#f3f6fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#436382"/></marker></defs><text x="30" y="42" font-family="Arial" font-size="25" font-weight="bold" fill="#14283f">Generate in a compressed video space</text><rect x="30" y="80" width="320" height="115" rx="14" fill="#dceafa"/><text x="48" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#14283f">Frame autoencoder</text><text x="48" y="157" font-family="Arial" font-size="16" fill="#304b68">RGB → compact learned features</text><path d="M358 137 H387" stroke="#436382" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="80" width="320" height="115" rx="14" fill="#e0f0e8"/><text x="414" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#14283f">Conditional latent flow</text><text x="414" y="157" font-family="Arial" font-size="16" fill="#304b68">Image or history → future latents</text><path d="M724 137 H753" stroke="#436382" stroke-width="3" marker-end="url(#a)"/><rect x="762" y="80" width="320" height="115" rx="14" fill="#eee4fa"/><text x="780" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#14283f">Frozen decoder</text><text x="780" y="157" font-family="Arial" font-size="16" fill="#304b68">Latents → visible RGB frames</text><text x="30" y="244" font-family="Arial" font-size="17" fill="#304b68">The decoder sets a reconstruction limit; the generator must also learn plausible motion.</text></svg>