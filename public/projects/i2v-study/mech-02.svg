<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="280" viewBox="0 0 1120 280"><rect width="1120" height="280" rx="18" fill="#f3f6fb"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#436382"/></marker></defs><text x="30" y="42" font-family="Arial" font-size="25" font-weight="bold" fill="#14283f">Conditional diffusion</text><rect x="30" y="80" width="320" height="115" rx="14" fill="#dceafa"/><text x="48" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#14283f">Known training future</text><text x="48" y="157" font-family="Arial" font-size="16" fill="#304b68">x_s = a x_0 + b epsilon</text><path d="M358 137 H387" stroke="#436382" stroke-width="3" marker-end="url(#a)"/><rect x="396" y="80" width="320" height="115" rx="14" fill="#e0f0e8"/><text x="414" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#14283f">Conditioned denoiser</text><text x="414" y="157" font-family="Arial" font-size="16" fill="#304b68">Noisy whole clip + image + s</text><path d="M724 137 H753" stroke="#436382" stroke-width="3" marker-end="url(#a)"/><rect x="762" y="80" width="320" height="115" rx="14" fill="#eee4fa"/><text x="780" y="117" font-family="Arial" font-size="20" font-weight="bold" fill="#14283f">Reverse sampling</text><text x="780" y="157" font-family="Arial" font-size="16" fill="#304b68">Fresh noise → repeated updates</text><text x="30" y="244" font-family="Arial" font-size="17" fill="#304b68">Noise time s and video-frame time are different axes. Every future frame updates together.</text></svg>